name: Source fixture preparation
on:
  push:
    branches: [codex/source-bounded-fixture-prep-oct12]
permissions:
  contents: read
concurrency:
  group: source-fixture-prep-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reject:
    if: github.ref != 'refs/heads/codex/source-bounded-fixture-prep-oct12' || github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
  prepare:
    if: github.ref == 'refs/heads/codex/source-bounded-fixture-prep-oct12' && github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0f9611c1c8e6934aa3f8d0fce924bcc9f4da9d5d
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          working_directory: source
          cache: false
          persist_github_token: false
      - name: Owning formatter, reference sync and unchanged Windows test limits
        run: node support/.github/scripts/prepare.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: source-fixture-preparation
          path: source/artifacts/source-fixture-preparation
          if-no-files-found: error
