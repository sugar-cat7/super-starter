name: Source final verification
on:
  workflow_dispatch:
    inputs:
      source_finalize:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: source-finalize-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reject:
    if: github.ref != 'refs/heads/codex/source-finalize-oct12' || inputs.source_finalize != true
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
  finalize:
    if: github.ref == 'refs/heads/codex/source-finalize-oct12' && inputs.source_finalize == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 98312ce0a1441185e4cd25509d4dc694424b0317
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          working_directory: source
          cache: false
          persist_github_token: false
      - name: Real source checks and normal Git events
        run: node support/.github/scripts/finalize.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: source-final-verification
          path: source/artifacts/source-finalize
          if-no-files-found: error
