name: Quality

on:
  workflow_dispatch:
    inputs:
      agent_desktop_bootstrap:
        description: Prepare only this hash-pinned independently generated Desktop feature
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.agent_desktop_bootstrap == true && github.ref == 'refs/heads/codex/agent-desktop-0f'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          cache: false
          persist_github_token: false
      - name: Real Linux native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 at-spi2-core
      - name: Hash-pinned source setup and genuine normal Git events
        run: dbus-run-session -- xvfb-run -a python3 .github/scripts/bootstrap.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: independent-desktop-bootstrap-0f
          path: .state/desktop-bootstrap/project/artifacts
          include-hidden-files: true
          if-no-files-found: error
