name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    outputs:
      fixtures: ${{ steps.plan.outputs.fixtures }}
      native: ${{ steps.plan.outputs.native }}
      workers: ${{ steps.plan.outputs.workers }}
      native_matrix: ${{ steps.plan.outputs.native_matrix }}
      fixtures_matrix: ${{ steps.plan.outputs.fixtures_matrix }}
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.12
          cache: false
          persist_github_token: false
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: node tools/quality/ci-plan.ts
      - run: pnpm env:setup -- --javascript
      - run: node tools/quality/checkout.ts
      - name: Actual application browser prerequisites
        run: node tools/quality/ci-plan.ts browsers
      - name: Actual checkout affected runtime, UI and build checks
        run: pnpm gate:ci -- --base "$CI_BASE_SHA" --checks javascript
      - name: Reference blueprint integrity
        run: node -e 'const s=JSON.parse(require("fs").readFileSync(".template.json","utf8")); if(s.kind==="reference") require("child_process").execFileSync(process.execPath,["tools/generators/cli.ts","sync","--check","--no-install"],{stdio:"inherit"}); else console.log("Reference sync not_required for a generated project");'
      - if: steps.plan.outputs.fixtures == 'true'
        run: pnpm template:verify -- --generate-only --output generated
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.fixtures == 'true'
        with:
          name: generated-projects
          path: generated
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-evidence
          path: artifacts
          if-no-files-found: error
  generated:
    if: needs.source.outputs.fixtures == 'true'
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.fixtures_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Deliberately no source checkout. Each artifact is a separate named/scoped project.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-projects
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.12
          working_directory: ${{ matrix.preset }}
          cache: false
          persist_github_token: false
      - name: Native Linux prerequisites
        if: runner.os == 'Linux' && contains(matrix.preset, 'desktop')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Setup generated project
        working-directory: ${{ matrix.preset }}
        run: pnpm env:setup
      - name: Browser prerequisite
        if: runner.os == 'Linux' && !contains(matrix.preset, 'api') && matrix.preset != 'desktop'
        working-directory: ${{ matrix.preset }}
        run: pnpm --filter ./packages/web exec playwright install --with-deps chromium
      - name: Generated doctor
        working-directory: ${{ matrix.preset }}
        run: pnpm env:doctor
      - name: Selected full gate (native Linux)
        if: runner.os == 'Linux' && contains(matrix.preset, 'desktop')
        working-directory: ${{ matrix.preset }}
        run: xvfb-run -a pnpm gate:full
      - name: Selected full gate
        if: runner.os != 'Linux' || !contains(matrix.preset, 'desktop')
        working-directory: ${{ matrix.preset }}
        run: pnpm gate:full
      - name: Generator and failure rehearsal
        if: matrix.preset == 'web'
        working-directory: ${{ matrix.preset }}
        run: pnpm template:verify -- --preset web --faults --hooks --lifecycle
      - name: Native and persistence failure propagation
        if: matrix.preset == 'desktop' || matrix.preset == 'api-bindings'
        working-directory: ${{ matrix.preset }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ] && [ "${{ matrix.preset }}" = desktop ]; then
            xvfb-run -a pnpm template:faults
          else
            pnpm template:faults
          fi
      - name: Windows real Git events and process cleanup
        if: matrix.preset == 'desktop' && runner.os == 'Windows'
        working-directory: ${{ matrix.preset }}
        run: pnpm template:hooks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: generated-evidence-${{ matrix.preset }}-${{ runner.os }}
          path: ${{ matrix.preset }}/artifacts
          if-no-files-found: error
  native:
    if: needs.source.outputs.native == 'true'
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.12
          cache: false
          persist_github_token: false
      - name: Native Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: pnpm env:setup
      - run: node tools/quality/checkout.ts
      - name: Actual native checks on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm gate:ci -- --base "$CI_BASE_SHA" --checks native
      - name: Actual native checks on macOS or Windows
        if: runner.os != 'Linux'
        shell: bash
        run: pnpm gate:ci -- --base "$CI_BASE_SHA" --checks native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: actual-native-evidence-${{ runner.os }}
          path: artifacts
          if-no-files-found: error
  worker-windows:
    if: needs.source.outputs.workers == 'true'
    needs: source
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.12
          cache: false
          persist_github_token: false
      - run: pnpm env:setup -- --javascript
      - run: node tools/quality/checkout.ts
      - shell: bash
        run: pnpm gate:ci -- --base "$CI_BASE_SHA" --checks worker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: actual-worker-evidence-Windows
          path: artifacts
          if-no-files-found: error
  required:
    if: always()
    needs: [source, generated, native, worker-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every planned job
        env:
          RESULTS: ${{ toJSON(needs) }}
          FIXTURES: ${{ needs.source.outputs.fixtures }}
          NATIVE: ${{ needs.source.outputs.native }}
          WORKERS: ${{ needs.source.outputs.workers }}
        run: >-
          node -e 'const jobs=JSON.parse(process.env.RESULTS); const plan={source:"true",generated:process.env.FIXTURES,native:process.env.NATIVE,"worker-windows":process.env.WORKERS}; for(const [name,required] of Object.entries(plan)) { if(!["true","false"].includes(required)) throw new Error(`Missing plan for ${name}`); const result=jobs[name]?.result; if(required==="true" && result!=="success") throw new Error(`${name} ${result}; planned checks must succeed`); if(required==="false" && result!=="skipped") throw new Error(`${name} unexpected result ${result}`); }'
