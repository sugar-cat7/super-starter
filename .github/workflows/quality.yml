name: Exact Source mechanical evidence

on:
  push:
    branches: [codex/source-evidence-653]
    paths:
      - .github/workflows/quality.yml
      - .github/scripts/source-evidence-collector.mjs
      - .github/payload/source-evidence-input.json
      - .github/scripts/source-external-sanitization.mjs
      - .github/payload/source-sanitization-rules.json

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    outputs:
      fixtures: ${{ steps.plan.outputs.fixtures }}
      native: ${{ steps.plan.outputs.native }}
      workers: ${{ steps.plan.outputs.workers }}
      observability: ${{ steps.plan.outputs.observability }}
      native_matrix: ${{ steps.plan.outputs.native_matrix }}
      fixtures_matrix: ${{ steps.plan.outputs.fixtures_matrix }}
      native_base: ${{ steps.plan.outputs.native_base }}
    env:
      CI_BASE_SHA: 63dc03962359d3164da0d34fbcdc1ccb2cec455f
      CI_HEAD_SHA: 653abf13ae3a54b2434c422ab8dc6800822387c3
      CI_FULL: 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: 653abf13ae3a54b2434c422ab8dc6800822387c3
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          cache: false
          persist_github_token: false
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: node tools/quality/ci-plan.ts
      - run: pnpm env:setup -- --javascript
      - run: node tools/quality/checkout.ts
      - name: Actual application browser prerequisites
        run: node tools/quality/ci-plan.ts browsers
      - name: Actual checkout affected runtime, UI and build checks
        run: pnpm gate:ci -- --base "$CI_BASE_SHA" --checks javascript
      - name: Reference blueprint integrity
        run: node -e 'const s=JSON.parse(require("fs").readFileSync(".template.json","utf8")); if(s.kind==="reference") require("child_process").execFileSync(process.execPath,["tools/generators/cli.ts","sync","--check","--no-install"],{stdio:"inherit"}); else console.log("Reference sync not_required for a generated project");'
      - name: Additional external-only Source sanitizer with actual build outputs and six genuine negative controls
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdirSync, realpathSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const root = realpathSync(process.cwd());
          assert.equal(process.env.GITHUB_REPOSITORY, 'sugar-cat7/super-starter');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/codex/source-evidence-653');
          assert.match(process.env.GITHUB_SHA ?? '', /^[a-f0-9]{40}$/u);
          const { foreignGitEnvironment } = await import(pathToFileURL(path.join(root, 'tools/quality/checkout.ts')));
          const env = foreignGitEnvironment(root);
          function git(argv) {
            const value = spawnSync('git', argv, { cwd: root, env, timeout: 120000, maxBuffer: 8000000 });
            assert.equal(value.error, undefined); assert.equal(value.signal, null); assert.equal(value.status, 0);
            return value.stdout;
          }
          assert.equal(git(['rev-parse', 'HEAD']).toString().trim(), '653abf13ae3a54b2434c422ab8dc6800822387c3');
          git(['fetch', 'origin', process.env.GITHUB_SHA]);
          const external = path.join(realpathSync(process.env.RUNNER_TEMP), 'source-sanitization-' + process.env.GITHUB_RUN_ID);
          assert.ok(external !== root && !external.startsWith(root + path.sep));
          mkdirSync(external, { recursive: true });
          const resources = [
            ['.github/scripts/source-external-sanitization.mjs', 'helper.mjs', 'bdcb2d8a89c05c63925f5eaf44d7b5e3671f3c8e3c1411020dcbff122f8684e9'],
            ['.github/payload/source-sanitization-rules.json', 'rules.json', '38f2cbe9f89f18109fe04fd7705a2385ca304937bb7d25ed7a7868ac553a5f04'],
          ];
          for (const [resource, name, expected] of resources) {
            const bytes = git(['show', process.env.GITHUB_SHA + ':' + resource]);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), expected);
            writeFileSync(path.join(external, name), bytes);
          }
          const result = spawnSync(process.execPath, [path.join(external, 'helper.mjs')], { cwd: root, env: { ...env, SOURCE_SANITIZATION_EXTERNAL: external }, timeout: 120000, maxBuffer: 8000000 });
          process.stdout.write(result.stdout ?? ''); process.stderr.write(result.stderr ?? '');
          assert.equal(result.error, undefined); assert.equal(result.signal, null); assert.equal(result.status, 0);
          NODE
      - name: Preserve external controlled negatives separately from accepted Source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-sanitization-controls
          path: ${{ runner.temp }}/source-sanitization-${{ github.run_id }}/controls
          if-no-files-found: error
      - if: steps.plan.outputs.fixtures == 'true' || steps.plan.outputs.observability == 'true'
        run: node tools/quality/ci-plan.ts generate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.fixtures == 'true' || steps.plan.outputs.observability == 'true'
        with:
          name: generated-projects
          path: generated
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-evidence
          path: |
            artifacts
            packages/*/artifacts
            packages/*/test-results
          if-no-files-found: error
  generated:
    if: needs.source.outputs.fixtures == 'true'
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.fixtures_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Deliberately no source checkout. Each artifact is a separate named/scoped project.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-projects
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          working_directory: ${{ matrix.preset }}
          cache: false
          persist_github_token: false
      - name: Native Linux prerequisites
        if: runner.os == 'Linux' && matrix.native
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 at-spi2-core
      - name: Setup generated native project
        if: matrix.native
        working-directory: ${{ matrix.preset }}
        run: pnpm env:setup
      - name: Setup generated JavaScript project
        if: '!matrix.native'
        working-directory: ${{ matrix.preset }}
        run: pnpm env:setup -- --javascript
      - name: Browser prerequisite
        if: runner.os == 'Linux' && !contains(matrix.preset, 'api') && matrix.preset != 'desktop'
        working-directory: ${{ matrix.preset }}
        run: pnpm --filter ./packages/web exec playwright install --with-deps chromium
      - name: Generated native doctor
        if: matrix.native
        working-directory: ${{ matrix.preset }}
        run: pnpm env:doctor
      - name: Generated JavaScript doctor
        if: '!matrix.native'
        working-directory: ${{ matrix.preset }}
        run: pnpm env:doctor -- --javascript
      - name: Rendered preset SAST on Linux
        if: runner.os == 'Linux'
        working-directory: ${{ matrix.preset }}
        run: |
          pnpm security:setup
          pnpm security:check -- --scanner semgrep
      - name: Selected full gate (native Linux)
        if: runner.os == 'Linux' && matrix.native
        working-directory: ${{ matrix.preset }}
        run: dbus-run-session -- xvfb-run -a pnpm gate:full
      - name: Selected native full gate
        if: runner.os != 'Linux' && matrix.native
        working-directory: ${{ matrix.preset }}
        run: pnpm gate:full
      - name: Selected full gate without native work
        if: "!matrix.native && !contains(matrix.preset, 'desktop')"
        working-directory: ${{ matrix.preset }}
        run: pnpm gate:full
      - name: Selected renderer gate
        if: "!matrix.native && contains(matrix.preset, 'desktop')"
        working-directory: ${{ matrix.preset }}
        run: pnpm gate:full -- --checks javascript
      - name: Native and persistence failure propagation
        if: matrix.faults
        working-directory: ${{ matrix.preset }}
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          if [ "$RUNNER_OS" = Linux ] && [ "$PRESET" = desktop ]; then
            dbus-run-session -- xvfb-run -a pnpm template:faults
          else
            pnpm template:faults
          fi
      - name: Real Git events and process cleanup
        if: matrix.hooks
        working-directory: ${{ matrix.preset }}
        run: pnpm template:hooks
      - name: Cold, warm and lifecycle rehearsal
        if: matrix.lifecycle
        working-directory: ${{ matrix.preset }}
        run: pnpm template:lifecycle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: generated-evidence-${{ matrix.preset }}-${{ runner.os }}
          path: |
            ${{ matrix.preset }}/artifacts
            ${{ matrix.preset }}/packages/*/artifacts
            ${{ matrix.preset }}/packages/*/test-results
          if-no-files-found: error
  native:
    if: needs.source.outputs.native == 'true'
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI_BASE_SHA: ${{ needs.source.outputs.native_base }}
      CI_HEAD_SHA: 653abf13ae3a54b2434c422ab8dc6800822387c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: 653abf13ae3a54b2434c422ab8dc6800822387c3
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          cache: false
          persist_github_token: false
      - name: Native Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 at-spi2-core
      - run: pnpm env:setup
      - run: node tools/quality/checkout.ts
      - name: Actual native checks on Linux
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a pnpm gate:ci -- --base "$CI_BASE_SHA" --checks native
      - name: Actual native checks on macOS or Windows
        if: runner.os != 'Linux'
        shell: bash
        run: pnpm gate:ci -- --base "$CI_BASE_SHA" --checks native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: actual-native-evidence-${{ runner.os }}
          path: |
            artifacts
            packages/*/artifacts
            packages/*/test-results
          if-no-files-found: error
  worker-windows:
    if: needs.source.outputs.workers == 'true'
    needs: source
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI_BASE_SHA: 63dc03962359d3164da0d34fbcdc1ccb2cec455f
      CI_HEAD_SHA: 653abf13ae3a54b2434c422ab8dc6800822387c3
      STARTER_RUNTIME_TRANSPORT_DIAGNOSTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: 653abf13ae3a54b2434c422ab8dc6800822387c3
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          cache: false
          persist_github_token: false
      - run: pnpm env:setup -- --javascript
      - run: node tools/quality/checkout.ts
      - shell: bash
        run: pnpm gate:ci -- --base "$CI_BASE_SHA" --checks worker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: actual-worker-evidence-Windows
          path: |
            artifacts
            packages/*/artifacts
            packages/*/test-results
          if-no-files-found: error
  observability:
    if: always() && !cancelled() && needs.source.result == 'success' && needs.source.outputs.observability == 'true'
    needs: [source, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The renamed/scoped project runs without access to the original repository.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-projects
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          working_directory: fullstack
          cache: false
          persist_github_token: false
      - working-directory: fullstack
        run: pnpm env:setup
      - working-directory: fullstack
        run: pnpm --filter ./packages/web exec playwright install --with-deps chromium
      - working-directory: fullstack
        run: pnpm o11y:setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.source.outputs.native == 'true'
        with:
          pattern: actual-native-evidence-*
          path: native-input
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.source.outputs.native == 'true'
        with:
          name: source-evidence
          path: source-input
      - working-directory: fullstack
        run: pnpm o11y:up
      - name: Real signals and official bounded MCP
        working-directory: fullstack
        shell: bash
        env:
          NATIVE_REQUIRED: ${{ needs.source.outputs.native }}
          CI_HEAD_SHA: 653abf13ae3a54b2434c422ab8dc6800822387c3
        run: |
          if [ "$NATIVE_REQUIRED" = true ]; then
            pnpm o11y:verify -- --native-artifacts ../native-input --native-source-evidence ../source-input/artifacts/ci-plan.json
          else
            pnpm o11y:verify
          fi
      - if: always()
        working-directory: fullstack
        run: pnpm o11y:down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: observability-evidence
          path: fullstack/artifacts/o11y
          if-no-files-found: error
  required:
    if: always()
    needs: [source, generated, native, worker-windows, observability]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every planned job
        env:
          RESULTS: ${{ toJSON(needs) }}
          FIXTURES: ${{ needs.source.outputs.fixtures }}
          NATIVE: ${{ needs.source.outputs.native }}
          WORKERS: ${{ needs.source.outputs.workers }}
          OBSERVABILITY: ${{ needs.source.outputs.observability }}
        run: >-
          node -e 'const jobs=JSON.parse(process.env.RESULTS); const plan={source:"true",generated:process.env.FIXTURES,native:process.env.NATIVE,"worker-windows":process.env.WORKERS,observability:process.env.OBSERVABILITY}; for(const [name,required] of Object.entries(plan)) { if(!["true","false"].includes(required)) throw new Error(`Missing plan for ${name}`); const result=jobs[name]?.result; if(required==="true" && result!=="success") throw new Error(`${name} ${result}; planned checks must succeed`); if(required==="false" && result!=="skipped") throw new Error(`${name} unexpected result ${result}`); }'

  security-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 653abf13ae3a54b2434c422ab8dc6800822387c3
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          cache: false
          persist_github_token: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:setup
      - run: pnpm security:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-identifiers
          path: artifacts/security
          if-no-files-found: error
          retention-days: 14
  collector-prepare:
    if: always()
    needs: [source, generated, native, worker-windows, observability, required, security-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      parts: ${{ steps.export.outputs.parts }}
    steps:
      - name: Exact mechanical carrier, not Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact unchanged Source CLI validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 653abf13ae3a54b2434c422ab8dc6800822387c3
          path: .state/validation-source
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          working_directory: .state/validation-source
          cache: false
          persist_github_token: false
      - name: Exact Source HEAD and clean guard before setup
        run: node .github/scripts/source-evidence-collector.mjs guard
      - name: Normal unchanged Source JavaScript setup
        working-directory: .state/validation-source
        run: pnpm env:setup -- --javascript
      - name: Immutable evidence artifacts from this workflow only
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: '*evidence*'
          path: .state/source-artifacts
      - name: This workflow's sanitized Security identifiers only
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: security-identifiers
          path: .state/source-artifacts/security-identifiers
      - name: Separate original controlled sanitizer evidence only
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-sanitization-controls
          path: .state/sanitization-controls
      - name: Validate raw LHR, run unchanged acceptance CLI, prepare bounded disjoint parts
        if: always()
        id: export
        env:
          COLLECTOR_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/source-evidence-collector.mjs prepare
      - name: Retain exact collector report, including actual blocked acceptance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-collector-report
          path: |
            artifacts/source-collector
            .state/validation-source/artifacts/acceptance.json
            .state/validation-source/artifacts/acceptance.md
          if-no-files-found: error
      - name: Retain disjoint plain exporter parts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-collector-parts
          path: .state/source-export-parts
          if-no-files-found: error
  collector-export:
    if: always() && needs.collector-prepare.outputs.parts != ''
    needs: collector-prepare
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.collector-prepare.outputs.parts) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          cache: false
          persist_github_token: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-collector-parts
          path: .state/source-export-parts
      - name: Emit only this disjoint bounded digest-checked part
        env:
          EVIDENCE_PART: ${{ matrix.part }}
        run: node .github/scripts/source-evidence-collector.mjs emit "$EVIDENCE_PART"
