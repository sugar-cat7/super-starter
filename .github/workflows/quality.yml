name: Exact Source Git verification
on:
  push:
    branches: [codex/source-bounded-verify-oct12]
permissions:
  contents: read
concurrency:
  group: exact-source-fixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reject:
    if: github.ref != 'refs/heads/codex/source-bounded-verify-oct12' || github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
  verify:
    if: github.ref == 'refs/heads/codex/source-bounded-verify-oct12' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0f9611c1c8e6934aa3f8d0fce924bcc9f4da9d5d
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          working_directory: source
          cache: false
          persist_github_token: false
      - name: Actual normal Source commit and push of the exact candidate
        run: node support/.github/scripts/verify.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: exact-source-fixture-verification
          path: source/artifacts/source-fixture-verification
          if-no-files-found: error
