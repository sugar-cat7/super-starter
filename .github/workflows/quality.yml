name: Independent final Web Agent support
on:
  push:
    branches: [codex/agent-web-983]
permissions:
  contents: read
concurrency:
  group: independent-web-agent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reject:
    if: github.event_name != 'push' || github.ref != 'refs/heads/codex/agent-web-983'
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
  agent-web-support:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/agent-web-983'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      evidence_matrix: ${{ steps.evidence-manifest.outputs.matrix }}
    steps:
      - name: Immutable reviewed mechanical support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - name: Readonly clean final source solely for cold own generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 460ad19c970adaab7231795f3438943d9158b135
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Owned Source preparation paths
        shell: bash
        run: |
          mkdir -p source/.state/t support/generation-evidence/wrangler-logs
          echo "TMPDIR=$GITHUB_WORKSPACE/source/.state/t" >> "$GITHUB_ENV"
          echo "TMP=$GITHUB_WORKSPACE/source/.state/t" >> "$GITHUB_ENV"
          echo "TEMP=$GITHUB_WORKSPACE/source/.state/t" >> "$GITHUB_ENV"
          echo "WRANGLER_LOG_PATH=$GITHUB_WORKSPACE/support/generation-evidence/wrangler-logs" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          working_directory: source
          cache: false
          persist_github_token: false
      - name: SDK first actual fresh CLI origin and owned Source removal
        run: node support/.github/scripts/web-agent-generate.mjs
      - name: Complete pristine baseline then genuine seven-file nonempty commit
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-bootstrap.mjs
      - name: Actual normal hook verified owned bare push
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-push.mjs
      - name: Canonical input before mandatory setup
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-input.mjs before-setup
      - name: Standard setup on immutable genuine feature
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-run.mjs setup pnpm env:setup
      - name: Canonical input after setup
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-input.mjs after-setup
      - name: Standard doctor
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-run.mjs doctor pnpm env:doctor
      - name: Official browser prerequisite
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-run.mjs browser-prerequisites pnpm --filter @independent-web/web exec playwright install --with-deps chromium
      - name: Standard dev with actual D1 count CRUD and SSR
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-dev.mjs
      - name: API meaningful normal and failure regressions
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-run.mjs targeted-test pnpm --filter @independent-web/api test
      - name: Web count response regressions
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-run.mjs targeted-test pnpm --filter @independent-web/web test
      - name: Standard pre PR complete browser and official Lighthouse100
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-gates.mjs pre-pr
      - name: Complete full gate no narrowing
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-gates.mjs full
      - name: Same actual source JavaScript CI entry
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-gates.mjs ci
      - name: Standard full build
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-run.mjs build pnpm build
      - name: Actual local API deployment preflight
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-run.mjs preflight pnpm deploy:preflight -- --target api --environment local
      - name: Actual local Web deployment preflight
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-run.mjs preflight pnpm deploy:preflight -- --target web --environment local
      - name: Dev actual negative observations remain blocked
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-dev-preflight.mjs
      - name: Final immutable input
        if: always()
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-input.mjs after-execution
      - name: Preserve actual new feature history
        if: always()
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-bundle.mjs
      - name: Mechanical support report only
        if: always()
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-report.mjs
      - name: Uncompressed digest checked plain JSON and raw Git evidence
        if: always()
        working-directory: feature
        run: node artifacts/agent-web-api/hosted-helpers/web-agent-audit.mjs
      - name: Index complete raw evidence for bounded same workflow transport
        id: evidence-manifest
        if: always()
        working-directory: support
        run: node .github/scripts/web-agent-evidence.mjs
      - name: Retain complete digest checked evidence for this same workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: independent-web-api-evidence460
          path: support/evidence-export
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: independent-web-api-final460
          path: |
            feature/artifacts
            feature/packages/*/artifacts
            feature/packages/*/test-results
            support/generation-evidence
          include-hidden-files: true
          if-no-files-found: error

  evidence-groups:
    if: always() && needs.agent-web-support.outputs.evidence_matrix != '' && github.ref == 'refs/heads/codex/agent-web-983' && github.event_name == 'push'
    needs: agent-web-support
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.agent-web-support.outputs.evidence_matrix) }}
    steps:
      - name: Immutable reviewed own transport helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Existing pinned JavaScript tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          cache: false
          persist_github_token: false
      - name: Read only actual artifact from this same workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: independent-web-api-evidence460
          path: .state/evidence-download
      - name: Emit one bounded complete digest checked evidence group
        env:
          WEB_AGENT_EVIDENCE_GROUP: ${{ matrix.group }}
        run: node .github/scripts/web-agent-evidence.mjs
