name: Reviewed Worker storage isolation preparation

on:
  push:
    branches: [codex/source-worker-fix-prep-460]
    paths:
      - .github/workflows/source-worker-fix-prep.yml
      - .github/scripts/source-worker-fix-prepare.mjs
      - .github/payload/source-worker-fix-input.json

permissions:
  contents: read

concurrency:
  group: source-worker-fix-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'sugar-cat7/super-starter' && github.ref == 'refs/heads/codex/source-worker-fix-prep-460'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      parts: ${{ steps.prepare.outputs.parts }}
    steps:
      - name: Exact preparation carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Unchanged clean Source before product correction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 460ad19c970adaab7231795f3438943d9158b135
          path: .state/fix-source
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          working_directory: .state/fix-source
          cache: false
          persist_github_token: false
      - name: Actual pre-fix failure and reviewed correction through normal owning commands
        id: prepare
        run: node .github/scripts/source-worker-fix-prepare.mjs prepare
      - name: Preserve actual preparation output and original SDK reports on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-worker-fix-preparation
          path: |
            artifacts/source-worker-fix
            .state/fix-source/artifacts
            .state/fix-source/packages/api/artifacts
            .state/fix-source/packages/sample-api/artifacts
          if-no-files-found: error
      - name: Preserve bounded disjoint plain transport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-worker-fix-parts
          path: .state/source-worker-fix-parts
          if-no-files-found: error
  export:
    if: always() && needs.prepare.outputs.parts != ''
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.prepare.outputs.parts) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          cache: false
          persist_github_token: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-worker-fix-parts
          path: .state/source-worker-fix-parts
      - name: Emit only this original bounded part
        env:
          PREPARATION_PART: ${{ matrix.part }}
        run: node .github/scripts/source-worker-fix-prepare.mjs emit "$PREPARATION_PART"
