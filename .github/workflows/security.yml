name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

# Scanning needs no write privileges. The remediation job only uses an already
# approved, separately configured credential; it never elevates GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.4
          cache: false
          persist_github_token: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:setup
      - run: pnpm security:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-identifiers
          path: artifacts/security
          if-no-files-found: error
          retention-days: 14
  remediate:
    # Never execute PR/fork code or consume an artifact in a privileged context.
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.4
          cache: false
          persist_github_token: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:setup
      - run: pnpm env:setup -- --javascript
      - run: pnpm security:remediate
        env:
          SECURITY_REMEDIATION_TOKEN: ${{ secrets.SECURITY_REMEDIATION_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-remediation-identifiers
          path: artifacts/security
          if-no-files-found: error
          retention-days: 14
