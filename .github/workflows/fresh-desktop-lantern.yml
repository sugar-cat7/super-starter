name: Fresh 460 Desktop Lantern Actor
on:
  push:
    branches: [rehearsal/fresh460-desktop-lantern]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: _mechanical
          persist-credentials: false
      - name: Isolate mechanical tools
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-counter-lantern-tools"
          cp _mechanical/.rehearsal/fresh-desktop-lantern/snapshot.mjs "$RUNNER_TEMP/desktop-counter-lantern-tools/snapshot.mjs"
          rm -rf _mechanical
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 460ad19c970adaab7231795f3438943d9158b135
          path: _source
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          working_directory: _source
          cache: false
          persist_github_token: false
      - name: Generate through owning CLI then remove source
        run: |
          test "$(git -C _source rev-parse HEAD)" = 460ad19c970adaab7231795f3438943d9158b135
          test -z "$(git -C _source status --porcelain)"
          test ! -e desktop-counter-lantern
          node _source/tools/generators/cli.ts init --target desktop-counter-lantern --name desktop-counter-lantern --scope @lantern-lab --preset desktop --identifier dev.lantern.counter --no-install
          rm -rf _source
          test ! -e _source
          test ! -e _mechanical
      - name: Independent pristine Git boundary and read generated instructions
        working-directory: desktop-counter-lantern
        run: |
          git init --template=
          git config user.name "Fresh Desktop Lantern Actor"
          git config user.email "fresh-desktop-lantern@example.invalid"
          git add .
          git commit -m "chore: initialize generated Desktop project"
          node "$RUNNER_TEMP/desktop-counter-lantern-tools/snapshot.mjs" pristine inspect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lantern-pristine-inspection
          path: desktop-counter-lantern/artifacts/actor
          include-hidden-files: true
          if-no-files-found: error
