name: Fresh 460 Desktop Lantern Actor
on:
  push:
    branches: [rehearsal/fresh460-desktop-lantern]
permissions:
  contents: read
jobs:
  actor:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      evidence_matrix: ${{ steps.transport.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: _mechanical
          persist-credentials: false
      - name: Isolate mechanical tools
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-counter-lantern-tools"
          cp _mechanical/.rehearsal/fresh-desktop-lantern/* "$RUNNER_TEMP/desktop-counter-lantern-tools/"
          rm -rf _mechanical
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 653abf13ae3a54b2434c422ab8dc6800822387c3
          path: _source
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          working_directory: _source
          cache: false
          persist_github_token: false
      - name: Normal Source JavaScript SDK preparation
        working-directory: _source
        run: |
          pnpm install --frozen-lockfile
          pnpm env:setup -- --javascript
      - name: Generate through owning CLI then remove source
        run: |
          node "$RUNNER_TEMP/desktop-counter-lantern-tools/verify.mjs" source _source before-generation
          test ! -e desktop-counter-lantern
          node _source/tools/generators/cli.ts init --target desktop-counter-lantern --name desktop-counter-lantern --scope @lantern-lab --preset desktop --identifier dev.lantern.counter --no-install
          node "$RUNNER_TEMP/desktop-counter-lantern-tools/verify.mjs" generated desktop-counter-lantern
          node "$RUNNER_TEMP/desktop-counter-lantern-tools/verify.mjs" source _source before-removal
          rm -rf _source
          test ! -e _source
          test ! -e _mechanical
      - name: Independent pristine Git boundary and read generated instructions
        working-directory: desktop-counter-lantern
        run: |
          git init --template=
          git config user.name "Fresh Desktop Lantern Actor"
          git config user.email "fresh-desktop-lantern@example.invalid"
          git add .
          git commit -m "chore: initialize generated Desktop project"
          node "$RUNNER_TEMP/desktop-counter-lantern-tools/snapshot.mjs" pristine quiet
      - name: Official Linux native prerequisites after source removal
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 at-spi2-core
      - name: Independently authored feature and standard project phases
        working-directory: desktop-counter-lantern
        run: dbus-run-session -- xvfb-run -a node "$RUNNER_TEMP/desktop-counter-lantern-tools/runner.mjs"
      - name: Complete final Git and raw phase evidence
        id: transport
        if: always()
        working-directory: desktop-counter-lantern
        run: |
          node "$RUNNER_TEMP/desktop-counter-lantern-tools/snapshot.mjs" final quiet
          node "$RUNNER_TEMP/desktop-counter-lantern-tools/evidence.mjs" prepare actor-linux-evidence ../lantern-actor-evidence-transport
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: lantern-actual-feature-bundle
          path: lantern-feature-transport
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lantern-actor-linux-evidence
          path: desktop-counter-lantern/artifacts
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lantern-actor-evidence-transport
          path: lantern-actor-evidence-transport
          include-hidden-files: true
          if-no-files-found: error
  actor-evidence:
    if: always() && needs.actor.outputs.evidence_matrix != ''
    needs: actor
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.actor.outputs.evidence_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: lantern-actor-evidence-transport
          path: lantern-actor-evidence-transport
      - name: Digest-checked bounded raw evidence part
        env:
          PART_INDEX: ${{ matrix.index }}
        run: node lantern-actor-evidence-transport/transport.mjs dump lantern-actor-evidence-transport "$PART_INDEX"
  native:
    needs: actor
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: lantern-actual-feature-bundle
          path: lantern-feature-transport
      - name: Clone only the actual feature bundle
        run: git -c core.longpaths=true clone lantern-feature-transport/feature.bundle desktop-counter-lantern
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.7
          working_directory: desktop-counter-lantern
          cache: false
          persist_github_token: false
      - name: Official Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 at-spi2-core
      - name: Actual feature native CI on Linux
        if: runner.os == 'Linux'
        working-directory: desktop-counter-lantern
        run: dbus-run-session -- xvfb-run -a node ../lantern-feature-transport/native-runner.mjs
      - name: Actual feature native CI on macOS or Windows
        if: runner.os != 'Linux'
        working-directory: desktop-counter-lantern
        run: node ../lantern-feature-transport/native-runner.mjs
      - name: Complete native raw evidence in ordinary logs
        if: always()
        working-directory: desktop-counter-lantern
        run: node ../lantern-feature-transport/evidence.mjs prepare native-evidence ../lantern-native-evidence-transport
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lantern-native-evidence-${{ runner.os }}
          path: desktop-counter-lantern/artifacts
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lantern-native-transport-${{ runner.os }}
          path: lantern-native-evidence-transport
          include-hidden-files: true
          if-no-files-found: error
  native-evidence-plan:
    if: always() && needs.actor.result == 'success'
    needs: [actor, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      evidence_matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: lantern-native-transport-*
          path: native-evidence-input
      - id: plan
        run: node native-evidence-input/lantern-native-transport-Linux/transport.mjs plan native-evidence-input
  native-evidence:
    if: always() && needs.native-evidence-plan.outputs.evidence_matrix != ''
    needs: native-evidence-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-evidence-plan.outputs.evidence_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: lantern-native-transport-${{ matrix.os }}
          path: native-evidence-part
      - name: Digest-checked bounded raw native evidence part
        env:
          PART_INDEX: ${{ matrix.index }}
        run: node native-evidence-part/transport.mjs dump native-evidence-part "$PART_INDEX"
