packages:
  - packages/*
# Setup owns dependency preparation; diagnostic/generator runs must not install.
verifyDepsBeforeRun: false
catalog:
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/sdk-trace-base': 2.12.0
  '@opentelemetry/resources': 2.12.0
  '@cloudflare/config': 0.24.1
  '@cloudflare/build-output-utils': 0.9.0
  lighthouse: 13.5.0
  '@wdio/types': 9.32.0
  '@wdio/spec-reporter': 9.32.0
  '@wdio/json-reporter': 9.32.0
  knip: 6.41.0
  yaml: 2.9.1
  '@types/mocha': 10.0.10
  oxc-parser: 0.153.0
  # cf beta.14 delegates development/build only to the official v2 plugin.
  '@cloudflare/vite-plugin': 2.0.0-beta.sha-91c870c02
  '@tanstack/react-router': 1.170.41
  '@tanstack/react-start': 1.168.60
  '@tailwindcss/vite': 4.3.3
  '@vitejs/plugin-react': 6.1.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@tauri-apps/api': 2.12.2
  '@tauri-apps/cli': 2.12.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7
  '@playwright/test': 1.64.0
  '@axe-core/playwright': 4.13.0
  '@wdio/cli': 9.32.0
  '@wdio/local-runner': 9.32.0
  '@wdio/mocha-framework': 9.32.0
  '@wdio/globals': 9.31.3
  '@wdio/tauri-service': 1.5.0
  '@wdio/tauri-plugin': 1.5.0
  webdriverio: 9.32.0
  cf: 1.0.0-beta.14
  wrangler: 4.149.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  zod: 4.6.5
  jsdom: 30.1.2
  '@types/node': 24.19.1
  typescript: 7.0.2
  vite-plus: 1.1.0
  vitest: 5.0.3
overrides:
  # Vite+ documents a single Vite core and the bundled Vitest version.
  vite@*: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest@*: 5.0.3
  # WDIO 9/Tauri's peer remains unchanged. The older transitive SDKs contain
  # unfixed ZIP/glob/FTP advisories; verify these public API migrations on each OS.
  '@wdio/utils@9.32.0>@puppeteer/browsers': 3.2.4
  '@wdio/mocha-framework@9.32.0>mocha': 11.8.0
  # Mocha 12 removed WDIO's run-helpers.js import; 11 retains it and needs this repair.
  mocha@11.8.0>serialize-javascript: 7.1.2
peerDependencyRules:
  allowedVersions:
    # The alias exposes Vite 8.3.3 with its own package version 1.1.0.
    vite: 1.1.0
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
allowBuilds:
  esbuild: true
  workerd: true
  # Embedded Tauri WebDriver starts inside the native app; no external driver download.
  edgedriver: false
  geckodriver: false
